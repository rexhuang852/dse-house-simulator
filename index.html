<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSE 要考幾多分先買到樓？</title>
  <style>
    /* ===== 全局（暖黃色調） ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Microsoft JhengHei", "PingFang HK", sans-serif;
      background: linear-gradient(180deg, #fdf3dd 0%, #faf0d7 60%);
      color: #3d2f1a;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 20px 16px 60px;
    }
    .screen { display: none; }
    .screen.active { display: block; animation: screenIn 0.6s ease; }
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }

    h2 { font-size: 19px; margin-bottom: 14px; line-height: 1.4; }
    .sub { color: #8a7355; font-size: 14px; line-height: 1.6; }

    /* ===== 開場 ===== */
    .hero { text-align: center; padding-top: 60px; }
    .hero h1 { font-size: 28px; line-height: 1.35; margin-bottom: 16px; }
    .hero .sub { margin-bottom: 28px; }

    /* ===== 按鈕 ===== */
    .btn-primary {
      width: 100%; padding: 15px; font-size: 16px; font-weight: 700;
      border: none; border-radius: 14px; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, #d97706, #b45309);
      box-shadow: 0 6px 16px rgba(180, 83, 9, 0.3);
    }
    .btn-primary:disabled { opacity: 0.4; box-shadow: none; cursor: not-allowed; }
    .btn-primary:active:not(:disabled) { opacity: 0.85; transform: scale(0.99); }
    .btn-secondary {
      width: 100%; padding: 14px; font-size: 15px; font-weight: 600;
      border: 1px solid #e8d9bd; border-radius: 14px; background: #fffdf7;
      color: #b45309; cursor: pointer; margin-top: 12px;
    }

    /* ===== 卡片 ===== */
    .cards { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: #fffdf7; border-radius: 16px; padding: 16px;
      box-shadow: 0 2px 10px rgba(61, 47, 26, 0.08); cursor: pointer;
      border: 2px solid transparent; transition: all 0.15s;
    }
    .card:hover { border-color: #eed9ae; }
    .card.selected { border-color: #d97706; background: #fdf0d5; }
    .card .card-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .card .card-desc { font-size: 13px; color: #8a7355; margin-top: 4px; line-height: 1.5; }
    .card .card-tag { font-size: 12px; color: #b45309; font-weight: 600; margin-top: 6px; }
    .card .card-tag.warn { color: #dc2626; }

    /* ===== 選項 chips ===== */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chip {
      padding: 10px 16px; border-radius: 999px; cursor: pointer;
      background: #fffdf7; border: 2px solid #e8d9bd; font-size: 14px; font-weight: 600;
    }
    .chip.selected { border-color: #d97706; background: #fdf0d5; color: #b45309; }

    /* ===== 劇情 ===== */
    .story-box {
      background: #fffdf7; border-radius: 16px; padding: 34px 22px;
      min-height: 180px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; box-shadow: 0 2px 10px rgba(61, 47, 26, 0.08);
      margin-bottom: 16px;
    }
    .story-emoji { font-size: 72px; margin-bottom: 18px; animation: emojiPop 0.5s ease; }
    @keyframes emojiPop {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .story-text { font-size: 17px; line-height: 1.7; animation: textIn 0.6s ease; }
    @keyframes textIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    .score-tag {
      display: inline-block; padding: 6px 14px;
      border-radius: 999px; font-size: 13px; font-weight: 700;
    }
    .score-tag.pos { background: #dcfce7; color: #15803d; }
    .score-tag.neg { background: #fee2e2; color: #b91c1c; }
    .effects-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }
    .story-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .btn-option {
      padding: 14px; border: 2px solid #e8d9bd; border-radius: 12px;
      background: #fffdf7; cursor: pointer; font-size: 15px; text-align: left;
      transition: all 0.15s;
    }
    .btn-option:hover { border-color: #d97706; }
    .btn-option:active { background: #fdf0d5; }

    /* ===== 輸入 ===== */
    input[type="number"] {
      width: 100%; padding: 14px; font-size: 20px; text-align: center;
      border: 2px solid #e8d9bd; border-radius: 14px; background: #fffdf7;
      margin-bottom: 14px; color: #3d2f1a;
    }
    input[type="number"]:focus { outline: none; border-color: #d97706; }

    /* ===== 地契 ===== */
    .deed {
      border: 4px double #8b5e3c; border-radius: 6px;
      padding: 22px; background: #fdf6e3; color: #5b4636;
      font-family: "Times New Roman", "Songti TC", serif; margin-bottom: 16px;
    }
    .deed h3 { text-align: center; font-size: 18px; letter-spacing: 2px; margin-bottom: 4px; }
    .deed .deed-sub { text-align: center; font-size: 11px; color: #8b5e3c; margin-bottom: 16px; }
    .deed .deed-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed #c9b28a; font-size: 14px; gap: 10px; }
    .deed .deed-row span:first-child { color: #8b5e3c; white-space: nowrap; }
    .deed .deed-row span:last-child { text-align: right; }
    .deed .deed-seal {
      width: 90px; height: 90px; border-radius: 50%;
      border: 3px solid #c0392b; color: #c0392b;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 12px; margin: 16px auto 0;
      transform: rotate(-12deg); line-height: 1.3;
    }
    .deed.rejected { background: #fef2f2; border-color: #dc2626; color: #7f1d1d; }
    .deed.rejected .deed-seal { border-color: #7f1d1d; color: #7f1d1d; }

    /* ===== 反思幕 ===== */
    .social-item {
      background: #fffdf7; border-radius: 14px; padding: 16px;
      box-shadow: 0 2px 10px rgba(61, 47, 26, 0.08); margin-bottom: 10px;
      display: flex; align-items: center; gap: 14px;
    }
    .social-num { font-size: 26px; font-weight: 800; color: #b45309; min-width: 76px; }
    .social-text { font-size: 13px; color: #6b5538; line-height: 1.5; }
    .reflection {
      background: #2a1f12; color: #faf0d7; border-radius: 16px;
      padding: 30px 22px; font-size: 19px; line-height: 2;
      margin: 20px 0; text-align: center; letter-spacing: 1px;
      animation: slowIn 1.4s ease;
    }
    @keyframes slowIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: none; }
    }

    /* ===== 海報 ===== */
    .poster {
      background: #fffdf7; border-radius: 18px; overflow: hidden;
      box-shadow: 0 8px 24px rgba(61, 47, 26, 0.15); margin-bottom: 12px;
    }
    .poster-head {
      background: linear-gradient(135deg, #d97706, #b45309);
      color: #fff; padding: 18px; text-align: center;
    }
    .poster-head h3 { font-size: 17px; }
    .poster-body { padding: 18px; }
    .poster-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f3e8d0; font-size: 14px; }
    .poster-line span:first-child { color: #8a7355; }
    .poster-subtitle { font-size: 13px; font-weight: 700; color: #b45309; margin-top: 14px; }
    .poster-choice {
      padding: 8px 0; font-size: 13px; color: #6b5538; line-height: 1.6;
      border-bottom: 1px dashed #f3e8d0;
    }
    .poster-conclusion {
      margin-top: 16px; padding: 18px; background: #2a1f12; color: #faf0d7;
      border-radius: 14px; font-size: 16px; line-height: 1.9; font-weight: 600;
      text-align: center; letter-spacing: 0.5px;
    }
    .share-hint { text-align: center; color: #8a7355; font-size: 13px; margin: 8px 0 4px; }
  </style>
</head>
<body>

  <!-- ① 開場 -->
  <section class="screen active" id="screen-1">
    <div class="hero">
      <h1>DSE 要考幾多分，<br>先可以喺香港買到樓？</h1>
      <p class="sub">一場關於分數、樓價，<br>同埋你點樣過呢一生嘅模擬</p>
      <button class="btn-primary" onclick="goTo(2)">開始 ▶</button>
    </div>
  </section>

  <!-- ② 揀樓 -->
  <section class="screen" id="screen-2">
    <h2>你想住邊種樓？</h2>
    <div class="cards" id="houseCards"></div>
  </section>

  <!-- ③ 揀年齡＋地區 -->
  <section class="screen" id="screen-3">
    <h2>幾多歲買樓？</h2>
    <div class="chips" id="ageChips"></div>
    <h2>想喺邊區買？</h2>
    <div class="chips" id="districtChips"></div>
    <button class="btn-primary" id="toTrackBtn" disabled onclick="goTo(4)">下一步 ▶</button>
  </section>

  <!-- ④ DSE 選科 -->
  <section class="screen" id="screen-4">
    <h2>你 DSE 揀咗咩選修科？</h2>
    <p class="sub" style="margin-bottom:12px">揀 2-3 科，會影響推薦邊啲專業</p>
    <div class="chips" id="subjectChips"></div>
    <button class="btn-primary" id="toTrackBtn2" disabled onclick="goTo(5)">下一步 ▶</button>
  </section>

  <!-- ⑤ 揀方向 -->
  <section class="screen" id="screen-5">
    <h2>你 DSE 想讀咩方向？</h2>
    <div class="cards" id="trackCards"></div>
  </section>

  <!-- ⑥ 揀專業 -->
  <section class="screen" id="screen-6">
    <h2>系統篩出 3 個專業畀你揀</h2>
    <p class="sub" id="targetScoreNote" style="margin-bottom:12px"></p>
    <div class="cards" id="majorCards"></div>
  </section>

  <!-- ⑦ 預計分數 -->
  <section class="screen" id="screen-7">
    <h2>你預計自己 DSE 考到幾多分？</h2>
    <p class="sub" style="margin-bottom:12px">JUPAS 加權分（數字，例如 30）</p>
    <input type="number" id="myScoreInput" placeholder="例如 30" min="0" max="60">
    <button class="btn-primary" id="toStoryBtn">開始我嘅人生 ▶</button>
  </section>

  <!-- ⑧ 劇情 -->
  <section class="screen" id="screen-8">
    <h2>你嘅人生，開始了</h2>
    <div class="story-box" id="storyBox"></div>
    <div class="story-options" id="storyOptions"></div>
    <button class="btn-primary" id="storyNext">繼續 ▶</button>
  </section>

  <!-- ⑨ 地契 -->
  <section class="screen" id="screen-9">
    <h2 id="deedTitle">恭喜！</h2>
    <div class="deed" id="deed"></div>
    <button class="btn-primary" onclick="renderSocial(); goTo(10)">繼續 ▶</button>
  </section>

  <!-- ⑩ 反思幕 -->
  <section class="screen" id="screen-10">
    <h2>但係，現實係…</h2>
    <p class="sub" style="margin-bottom:12px">以下，係真實嘅香港。</p>
    <div id="socialList"></div>
    <div class="reflection" id="reflection"></div>
    <button class="btn-primary" onclick="renderPoster(); goTo(11)">生成海報 ▶</button>
  </section>

  <!-- ⑪ 海報 -->
  <section class="screen" id="screen-11">
    <h2>你嘅結局</h2>
    <div class="poster" id="poster"></div>
    <p class="share-hint">📸 截圖分享俾朋友，問吓佢考到幾多分</p>
    <button class="btn-secondary" onclick="shareLink()">🔗 複製分享連結</button>
    <button class="btn-secondary" onclick="restart()">再玩一次 ↺</button>
  </section>

  <script>
    // ================= 數據 =================

    // 房子：threshold = 買樓所需積分（7 個事件總分）；ratio = 全港住得起嘅估算比例

      { id:'villa',   name:'獨棟別墅', emoji:'🏰', price:'5,000萬+',      needScore:45, needIncome:'50萬+',  ratio:'<0.1%', area:'3,000 呎', floor:'獨立屋', duty:'約 213 萬', threshold:16, desc:'山頂嗰種，有花園有泳池' },
      { id:'mansion', name:'千尺豪宅', emoji:'🏢', price:'1,500-3,000萬', needScore:40, needIncome:'15-30萬', ratio:'約 4%',  area:'1,000 呎', floor:'45 樓',   duty:'約 64 萬',  threshold:12, desc:'1000呎，喺香港已經叫「豪宅」' },
      { id:'private', name:'洋樓',     emoji:'🏬', price:'600-1,200萬',   needScore:33, needIncome:'6-12萬',  ratio:'約 30%', area:'500 呎',   floor:'18 樓',   duty:'約 25 萬',  threshold:7,  desc:'有電梯有管理，正常人嘅目標' },
      { id:'tong',    name:'唐樓',     emoji:'🏚️', price:'300-600萬',     needScore:26, needIncome:'3-6萬',   ratio:'約 10%', area:'400 呎',   floor:'5 樓',    duty:'約 13 萬',  threshold:3,  desc:'無電梯，行樓梯當做運動' },
      { id:'public',  name:'公屋',     emoji:'🏘️', price:'唔使買（輪候）', needScore:0,  needIncome:'1-2萬',   ratio:'約 30%', area:'350 呎',   floor:'12 樓',   duty:'—',         threshold:-1, desc:'唔使買，但要排隊等到天荒地老' }
    ];

    const AGES = [25, 30, 35, 40];

    const DISTRICTS = [
      { id:'hk',  name:'港島', note:'最貴，但係最有面' },
      { id:'kln', name:'九龍', note:'中間，交通方便' },
      { id:'nt',  name:'新界', note:'較平，但返工遠' }
    ];

    // 每區嘅街道（地契地址用）
    const STREETS = {
      hk:  ['半山寶雲道', '跑馬地藍塘道', '北角英皇道'],
      kln: ['何文田佛光街', '九龍塘又一村', '旺角彌敦道'],
      nt:  ['沙田大圍美田路', '荃灣青山公路', '屯門龍門路']
    };

    // DSE 選修科
    const SUBJECTS = ['物理', '化學', '生物', '經濟', '歷史', '地理', 'ICT', 'BAFS', 'M1/M2'];

    // 專業：uni = 大學；score = JUPAS 2024 收生分數中位數（約）；required = 需要嘅選修科
    const TRACKS = {
      arts: {
        name:'文科', emoji:'📚',
        majors:[

          { name:'牙醫',       uni:'港大', score:48, career:'牙醫',       salary:'7-10萬',    required:['化學','生物'] },
          { name:'藥劑',       uni:'中大', score:36, career:'藥劑師',     salary:'4-6萬',     required:['化學'] },
          { name:'物理治療',   uni:'理大', score:32, career:'物理治療師', salary:'3.5-5萬',  required:['生物'] },
          { name:'數學',       uni:'港大', score:30, career:'分析師／教師', salary:'3-5萬',   required:['M1/M2'] },

    // 18 個人生事件：score=財富；health=健康；rel=關係（默認 0，只寫非零）；invest = 投資類（結果隨機）
    const EVENTS = [
      { emoji:'🏥', text:'你大病一場。',
        options:[
          { text:'硬撐住返工', score:1, health:-2, feedback:'你頂硬上返工，保住咗份糧，但係身體差咗好多。' },

        ] },
      { emoji:'👵', text:'返工路上，有個婆婆跌低喺路邊。',
        options:[

          { text:'搵路人幫手', score:1, feedback:'你搵咗人幫手，婆婆有救，你又冇遲到。' },
          { text:'默默離開', score:-1, rel:-1, feedback:'你行開咗，成日個心都唔安落。' }

    // 抽 10 個事件：保證至少 2 個投資類
    function pickEvents() {
      const investEvents = EVENTS.filter(e => e.options.some(o => o.invest));
      const otherEvents = EVENTS.filter(e => !e.options.some(o => o.invest));
      const pickedInvest = investEvents.slice().sort(() => Math.random() - 0.5).slice(0, 2);
      const remaining = otherEvents.concat(investEvents.filter(e => pickedInvest.indexOf(e) < 0));
      const pickedOther = remaining.slice().sort(() => Math.random() - 0.5).slice(0, 8);
      return pickedInvest.concat(pickedOther).sort(() => Math.random() - 0.5);
    }

    // 投資結果（隨機，成功率已調高平衡體驗）：high = 正常高風險；scam = 騙局型；mid = 中等；low = 低風險
    function investResult(type) {
      const r = Math.random();
      if (type === 'high') {
        if (r < 0.35) return { score: 4,  feedback:'你賭贏咗！投資大賺，首期近咗一大步！' };
        if (r < 0.65) return { score: 1,  feedback:'小賺一筆，好過冇。' };
        if (r < 0.85) return { score: -2, feedback:'蝕咗三成，心痛。' };
        return { score: -4, feedback:'血本無歸…你嘅首期又遠咗。' };
      }
      if (type === 'scam') {
        if (r < 0.15) return { score: 2,  feedback:'竟然真係回報咗…你好彩走得快。' };
        if (r < 0.5)  return { score: -2, feedback:'回報冇兌現，你蝕咗一半。' };
        return { score: -4, feedback:'原來係騙局，你血本無歸…' };
      }
      if (type === 'mid') {
        if (r < 0.45) return { score: 2,  feedback:'你小賺一筆！' };
        if (r < 0.8)  return { score: 0,  feedback:'打個和，冇賺冇蝕。' };
        return { score: -1, feedback:'蝕咗少少，當交學費。' };
      }
      // low
      if (r < 0.65) return { score: 1, feedback:'穩穩陣陣，小賺一筆。' };
      return { score: 0, feedback:'冇賺冇蝕，都算係咁。' };
    }

    // 目標分數 = 樓嘅分數 ＋ 年齡影響 ＋ 地區影響
    function effectiveScore(house) {
      const ageFactor = { 25: 4, 30: 2, 35: 0, 40: -2 }[state.age] || 0;
      const districtFactor = { hk: 3, kln: 0, nt: -3 }[state.district] || 0;
      return house.needScore + ageFactor + districtFactor;
    }
    function randomAddress() {
      const streets = STREETS[state.district];
      const street = streets[Math.floor(Math.random() * streets.length)];
      return street + ' ' + (Math.floor(Math.random() * 300) + 1) + ' 號';
    }
    function randomDate() {
      const year = 2025 + (state.age - 18);
      const month = Math.floor(Math.random() * 12) + 1;
      const day = Math.floor(Math.random() * 28) + 1;
      return year + '年' + month + '月' + day + '日';

    function renderTracks() {

    // ================= ⑥ 揀專業（選科匹配優先） =================
    function subjectMatch(m) {
      if (!m.required || m.required.length === 0) return true;
      return m.required.some(r => state.subjects.indexOf(r) >= 0);
    }
    function renderMajors() {
      const box = document.getElementById('majorCards');
      box.innerHTML = '';
      const house = getHouse();
      const majors = TRACKS[state.track].majors;
      const target = effectiveScore(house);
      // 顯示目標分數（受年齡地區影響）
      document.getElementById('targetScoreNote').textContent =
        '你嘅目標分數約 ' + target + ' 分（受年齡同地區影響）';
      // 選科匹配嘅排前面，再按同目標分數嘅距離
      const sorted = majors.slice().sort((a, b) => {
        const am = subjectMatch(a) ? 1 : 0;
        const bm = subjectMatch(b) ? 1 : 0;
        if (am !== bm) return bm - am;
        return Math.abs(a.score - target) - Math.abs(b.score - target);
      });
      const top3 = sorted.slice(0, 3);
      top3.forEach(m => {
        const matched = subjectMatch(m);
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML =
          '<div class="card-title">' + m.name + '</div>' +
          '<div class="card-desc">' + m.uni + ' · ' + m.career + ' · 月薪 ' + m.salary + '</div>' +
          '<div class="card-tag">JUPAS 2024 中位數約 ' + m.score + ' 分</div>' +
          '<div class="card-tag' + (matched ? '' : ' warn') + '">' + (matched ? '✅ 你嘅選科匹配' : '⚠️ 需要 ' + m.required.join('/') + '（你冇揀）') + '</div>';
        div.addEventListener('click', () => {
          state.major = m.name;
          goTo(7);
        });
        box.appendChild(div);
      });
    }

      picked.forEach(ev => {
        storyNodes.push({ emoji: ev.emoji, text: ev.text, options: ev.options, isEvent: true });
      });
      storyNodes.push({ emoji:'🔮', text:'呢段日子入面，你嘅選擇決定了你嘅結局…', isEnd: true });

      storyIndex = 0;
      renderStoryNode();

    // 揀完選項：顯示即時反饋 + 多維變化（💰財富 ❤️健康 👥關係）
    function showFeedback(feedback, score, health, rel) {
      const box = document.getElementById('storyBox');
      const nextBtn = document.getElementById('storyNext');
      const optsBox = document.getElementById('storyOptions');
      optsBox.style.display = 'none';
      optsBox.innerHTML = '';
      nextBtn.style.display = 'block';
      nextBtn.textContent = '繼續 ▶';

      let tags = '<div class="effects-tags">';
      tags += '<span class="score-tag ' + (score >= 0 ? 'pos' : 'neg') + '">💰 ' + (score >= 0 ? '+' : '') + score + '</span>';
      if (health !== 0) tags += '<span class="score-tag ' + (health > 0 ? 'pos' : 'neg') + '">❤️ ' + (health > 0 ? '+' : '') + health + '</span>';
      if (rel !== 0) tags += '<span class="score-tag ' + (rel > 0 ? 'pos' : 'neg') + '">👥 ' + (rel > 0 ? '+' : '') + rel + '</span>';
      tags += '</div>';

      box.innerHTML =
        '<div class="story-emoji">💬</div>' +
        '<div class="story-text">' + feedback + '</div>' +
        tags;
    }

    function renderStoryNode() {
      const box = document.getElementById('storyBox');
      const nextBtn = document.getElementById('storyNext');
      const optsBox = document.getElementById('storyOptions');

      if (storyIndex < storyNodes.length) {
        const node = storyNodes[storyIndex];
        box.innerHTML =
          '<div class="story-emoji">' + node.emoji + '</div>' +
          '<div class="story-text">' + node.text + '</div>';

        if (node.isEvent) {
          optsBox.style.display = 'flex';
          nextBtn.style.display = 'none';
          optsBox.innerHTML = '';
          node.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.textContent = opt.text;
            btn.addEventListener('click', () => {
              // 投資類選項：結果隨機；其他：固定分數
              let score, feedback;
              const health = opt.health || 0;
              const rel = opt.rel || 0;
              if (opt.invest) {
                const r = investResult(opt.invest);
                score = r.score;
                feedback = r.feedback;
                // 運氣統計：大賺/血虧影響運氣指數
                if (score >= 4) state.luck += 2;
                else if (score >= 1) state.luck += 1;
                else if (score <= -4) state.luck -= 2;
                else if (score < 0) state.luck -= 1;
              } else {
                score = opt.score;
                feedback = opt.feedback;
              }
              state.houseScore += score;
              state.health += health;
              state.rel += rel;
              // 記錄每個選擇，報告用
              state.choices.push({ event: node.text, choice: opt.text, feedback: feedback, score: score });
              showFeedback(feedback, score, health, rel);
            });
            optsBox.appendChild(btn);
          });
        } else {
          optsBox.style.display = 'none';
          nextBtn.style.display = 'block';
          nextBtn.textContent = node.isEnd ? '揭曉結局 ▶' : '繼續 ▶';
        }
      } else {
        // 7 個事件，積分 >= 1 買到樓（門檻調低，唔好太難）
        state.canBuy = state.houseScore >= getHouse().threshold;
        renderDeed();
        goTo(9);
      }
    }

    // ================= ⑨ 地契（純地契信息，唔放劇情） =================
    function renderDeed() {
      const house = getHouse();
      const district = getDistrict();
      const deed = document.getElementById('deed');
      const title = document.getElementById('deedTitle');

      if (state.canBuy) {
        title.textContent = '恭喜！你買到樓了';
        deed.className = 'deed';
        deed.innerHTML =
          '<h3>香港特別行政區</h3>' +
          '<div class="deed-sub">土地註冊處 · 物業契據</div>' +
          '<div class="deed-row"><span>註冊編號</span><span>' + ('REG-' + new Date().getFullYear() + '-' + Math.floor(Math.random() * 900000 + 100000)) + '</span></div>' +
          '<div class="deed-row"><span>物業</span><span>' + house.emoji + ' ' + house.name + '</span></div>' +
          '<div class="deed-row"><span>地址</span><span>' + district.name + randomAddress() + '（' + house.floor + '）</span></div>' +
          '<div class="deed-row"><span>實用面積</span><span>' + house.area + '</span></div>' +
          '<div class="deed-row"><span>成交價</span><span>HK$ ' + house.price + '</span></div>' +
          '<div class="deed-row"><span>印花稅</span><span>' + house.duty + '（已繳付）</span></div>' +
          '<div class="deed-row"><span>成交日期</span><span>' + randomDate() + '</span></div>' +
          '<div class="deed-seal">香港<br>樓市<br>見證</div>';
      } else {
        title.textContent = '現實係殘酷嘅';
        deed.className = 'deed rejected';
        deed.innerHTML =
          '<h3>置業申請通知</h3>' +
          '<div class="deed-sub">土地註冊處 · 未能成功</div>' +
          '<div class="deed-row"><span>目標物業</span><span>' + house.emoji + ' ' + house.name + '</span></div>' +
          '<div class="deed-row"><span>目標地區</span><span>' + district.name + '</span></div>' +
          '<div class="deed-row"><span>申請編號</span><span>' + ('REG-' + new Date().getFullYear() + '-' + Math.floor(Math.random() * 900000 + 100000)) + '</span></div>' +
          '<div class="deed-row"><span>結果</span><span>儲唔夠首期，買唔起</span></div>' +
          '<div class="deed-seal">香港<br>樓市<br>現實</div>';
      }
    }

    // ================= ⑩ 反思幕 =================
    function renderSocial() {
      const house = getHouse();
      const list = document.getElementById('socialList');
      list.innerHTML = '';

      SOCIAL.forEach(s => {
        const div = document.createElement('div');
        div.className = 'social-item';
        div.innerHTML =
          '<div class="social-num">' + s.num + '</div>' +
          '<div class="social-text">' + s.text + '</div>';
        list.appendChild(div);
      });

      const houseItem = document.createElement('div');
      houseItem.className = 'social-item';
      houseItem.innerHTML =
        '<div class="social-num">' + house.ratio + '</div>' +
        '<div class="social-text">全港大約有 ' + house.ratio + ' 人住得起「' + house.name + '」（估算）</div>';
      list.appendChild(houseItem);

      document.getElementById('reflection').innerHTML = state.canBuy
        ? '❝ 你買到樓了。<br><br>但係一路上，你犧牲咗啲乜？<br>定係，只係你運氣好啲？ ❞'
        : '❝ 你買唔到樓。<br><br>你努力咗，選擇咗，但運氣冇企喺你嗰邊。<br>人生入面，有啲乜比物質更重要？ ❞';
    }

    // 總結語（根據結局＋運氣＋健康＋關係生成，打動人用）
    function getConclusion() {
      const b = state.canBuy, l = state.luck, h = state.health, r = state.rel;
      if (b && h < 0 && r < 0) return '你買到樓，但係冇咗健康，又疏遠咗身邊嘅人。呢層樓，真係值得嗎？';
      if (b && h < 0) return '你買到樓了。但係捱到身體都壞咗——呢層樓，真係值得嗎？';
      if (b && r < 0) return '你買到樓了。但係身邊嘅人，已經一個一個疏遠咗。';
      if (b && l >= 1) return '你買到樓，運氣幫咗好多。諗返轉頭——努力同運氣，邊樣多啲？';
      if (b) return '你靠實力同毅力買到樓。喺呢個城市，努力仲係有回報嘅。';
      if (!b && h >= 1 && r >= 1) return '你買唔到樓，但係你健康、有人陪。呢啲，用錢都買唔到。';
      if (!b && l >= 1) return '你已經好努力，運氣都幫唔到你——呢個，先係香港樓市嘅真相。';
      return '努力唔一定有回報。但係人生，唔係淨係得一層樓。';
    }

    function healthText(h) {
      if (h >= 4) return '身壯力健 💪';
      if (h >= 1) return '身體唔錯';
      if (h >= -1) return '身體一般';
      if (h >= -4) return '身體越嚟越差';
      return '身體垮咗 🏥';
    }
    function relText(r) {
      if (r >= 4) return '親友滿堂 ❤️';
      if (r >= 1) return '人緣唔錯';
      if (r >= -1) return '關係平平';
      if (r >= -4) return '越嚟越孤單';
      return '孤家寡人 🥀';
    }

    // ================= ⑪ 海報（人生報告：關鍵決定＋運氣＋總結） =================
    function renderPoster() {
      const house = getHouse();
      const district = getDistrict();
      const major = getMajor();
      const gap = major.score - state.myScore;
      const poster = document.getElementById('poster');

      // 運氣評語
      let luckText;
      if (state.luck >= 3) luckText = '運氣爆棚 🍀';
      else if (state.luck >= 1) luckText = '運氣唔錯';
      else if (state.luck >= -1) luckText = '運氣平平';
      else if (state.luck >= -3) luckText = '運氣麻麻';
      else luckText = '運氣差到貼地 🥀';

      // 影響最大嘅 3 個關鍵決定
      const keyChoices = state.choices.slice()
        .sort((a, b) => Math.abs(b.score) - Math.abs(a.score))
        .slice(0, 3);

      let html =
        '<div class="poster-head"><h3>DSE 買樓模擬器 · 人生報告</h3></div>' +
        '<div class="poster-body">' +
          '<div class="poster-line"><span>目標樓宇</span><span>' + house.emoji + ' ' + house.name + '</span></div>' +
          '<div class="poster-line"><span>目標地區</span><span>' + district.name + '</span></div>' +
          '<div class="poster-line"><span>選讀專業</span><span>' + major.name + '（' + major.uni + '）</span></div>' +
          '<div class="poster-line"><span>目標分數</span><span>' + major.score + ' 分</span></div>' +
          '<div class="poster-line"><span>你嘅預計分數</span><span>' + state.myScore + ' 分</span></div>' +
          '<div class="poster-line"><span>分數距離</span><span>' + (gap > 0 ? '仲差 ' + gap + ' 分' : '已經達標 🎉') + '</span></div>' +
          '<div class="poster-line"><span>運氣指數</span><span>' + luckText + '</span></div>' +
          '<div class="poster-line"><span>健康</span><span>' + healthText(state.health) + '</span></div>' +
          '<div class="poster-line"><span>人際關係</span><span>' + relText(state.rel) + '</span></div>' +
          '<div class="poster-line"><span>結局</span><span>' + (state.canBuy ? '✅ 買到樓' : '❌ 買唔到樓') + '</span></div>';

      // 你嘅關鍵決定
      if (keyChoices.length > 0) {
        html += '<div class="poster-subtitle">你嘅關鍵決定</div>';
        keyChoices.forEach(c => {
          html += '<div class="poster-choice">「' + c.event + '」<br>你揀咗「' + c.choice + '」——' +
            c.feedback + '（' + (c.score >= 0 ? '+' : '') + c.score + ' 分）</div>';
        });
      }

      // 總結語
      html += '<div class="poster-conclusion">' + getConclusion() + '</div>';

      html += '</div>';
      poster.innerHTML = html;
    }

    // ================= 事件綁定 =================
    document.getElementById('storyNext').addEventListener('click', () => {
      storyIndex++;
      renderStoryNode();
    });
    document.getElementById('toStoryBtn').addEventListener('click', () => {
      const v = parseFloat(document.getElementById('myScoreInput').value);
      if (isNaN(v) || v < 0) { alert('請輸入你預計嘅分數'); return; }
      state.myScore = v;
      goTo(8);
      startStory();
    });

    // ================= 啟動 =================
    renderHouses();
    renderAges();
    renderDistricts();
    renderSubjects();
    renderTracks();
  </script>
</body>
</html>
