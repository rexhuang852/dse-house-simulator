<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSE 要考幾多分先買到樓？</title>
  <style>
    /* ===== 全局（暖黃色調） ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Microsoft JhengHei", "PingFang HK", sans-serif;
      background: linear-gradient(180deg, #fdf3dd 0%, #faf0d7 60%);
      color: #3d2f1a;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 20px 16px 60px;
    }
    .screen { display: none; }
    .screen.active { display: block; animation: screenIn 0.6s ease; }
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }

    h2 { font-size: 19px; margin-bottom: 14px; line-height: 1.4; }
    .sub { color: #8a7355; font-size: 14px; line-height: 1.6; }

    /* ===== 開場 ===== */
    .hero { text-align: center; padding-top: 60px; }
    .hero h1 { font-size: 28px; line-height: 1.35; margin-bottom: 16px; }
    .hero .sub { margin-bottom: 28px; }

    /* ===== 按鈕 ===== */
    .btn-primary {
      width: 100%; padding: 15px; font-size: 16px; font-weight: 700;
      border: none; border-radius: 14px; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, #d97706, #b45309);
      box-shadow: 0 6px 16px rgba(180, 83, 9, 0.3);
    }
    .btn-primary:disabled { opacity: 0.4; box-shadow: none; cursor: not-allowed; }
    .btn-primary:active:not(:disabled) { opacity: 0.85; transform: scale(0.99); }
    .btn-secondary {
      width: 100%; padding: 14px; font-size: 15px; font-weight: 600;
      border: 1px solid #e8d9bd; border-radius: 14px; background: #fffdf7;
      color: #b45309; cursor: pointer; margin-top: 12px;
    }

    /* ===== 卡片 ===== */
    .cards { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: #fffdf7; border-radius: 16px; padding: 16px;
      box-shadow: 0 2px 10px rgba(61, 47, 26, 0.08); cursor: pointer;
      border: 2px solid transparent; transition: all 0.15s;
    }
    .card:hover { border-color: #eed9ae; }
    .card.selected { border-color: #d97706; background: #fdf0d5; }
    .card .card-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .card .card-desc { font-size: 13px; color: #8a7355; margin-top: 4px; line-height: 1.5; }
    .card .card-tag { font-size: 12px; color: #b45309; font-weight: 600; margin-top: 6px; }
    .card.disabled { opacity: 0.45; cursor: not-allowed; }
    .card.disabled .card-tag { color: #dc2626; }

    /* ===== 選項 chips ===== */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chip {
      padding: 10px 16px; border-radius: 999px; cursor: pointer;
      background: #fffdf7; border: 2px solid #e8d9bd; font-size: 14px; font-weight: 600;
    }
    .chip.selected { border-color: #d97706; background: #fdf0d5; color: #b45309; }

    /* ===== 劇情 ===== */
    .story-box {
      background: #fffdf7; border-radius: 16px; padding: 34px 22px;
      min-height: 220px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; box-shadow: 0 2px 10px rgba(61, 47, 26, 0.08);
      margin-bottom: 16px;
    }
    .story-emoji { font-size: 72px; margin-bottom: 18px; animation: emojiPop 0.5s ease; }
    @keyframes emojiPop {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .story-text { font-size: 17px; line-height: 1.7; animation: textIn 0.6s ease; }
    @keyframes textIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    /* ===== 地契 ===== */
    .deed {
      border: 4px double #8b5e3c; border-radius: 6px;
      padding: 22px; background: #fdf6e3; color: #5b4636;
      font-family: "Times New Roman", "Songti TC", serif; margin-bottom: 16px;
    }
    .deed h3 { text-align: center; font-size: 18px; letter-spacing: 2px; margin-bottom: 4px; }
    .deed .deed-sub { text-align: center; font-size: 11px; color: #8b5e3c; margin-bottom: 16px; }
    .deed .deed-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed #c9b28a; font-size: 14px; }
    .deed .deed-row span:first-child { color: #8b5e3c; }
    .deed .deed-seal {
      width: 90px; height: 90px; border-radius: 50%;
      border: 3px solid #c0392b; color: #c0392b;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 12px; margin: 16px auto 0;
      transform: rotate(-12deg); line-height: 1.3;
    }
    .deed.rejected { background: #fef2f2; border-color: #dc2626; color: #7f1d1d; }
    .deed.rejected .deed-seal { border-color: #7f1d1d; color: #7f1d1d; }

    /* ===== 思考幕 ===== */
    .social-item {
      background: #fffdf7; border-radius: 14px; padding: 16px;
      box-shadow: 0 2px 10px rgba(61, 47, 26, 0.08); margin-bottom: 10px;
      display: flex; align-items: center; gap: 14px;
    }
    .social-num { font-size: 22px; font-weight: 800; color: #b45309; min-width: 70px; }
    .social-text { font-size: 13px; color: #6b5538; line-height: 1.5; }
    .reflection {
      background: #3d2f1a; color: #faf0d7; border-radius: 14px;
      padding: 18px; font-size: 15px; line-height: 1.7; margin: 16px 0;
    }

    /* ===== 海報 ===== */
    .poster {
      background: #fffdf7; border-radius: 18px; overflow: hidden;
      box-shadow: 0 8px 24px rgba(61, 47, 26, 0.15); margin-bottom: 12px;
    }
    .poster-head {
      background: linear-gradient(135deg, #d97706, #b45309);
      color: #fff; padding: 18px; text-align: center;
    }
    .poster-head h3 { font-size: 17px; }
    .poster-body { padding: 18px; }
    .poster-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f3e8d0; font-size: 14px; }
    .poster-line span:first-child { color: #8a7355; }
    .share-hint { text-align: center; color: #8a7355; font-size: 13px; margin: 8px 0 4px; }
  </style>
</head>
<body>

  <!-- ① 開場 -->
  <section class="screen active" id="screen-1">
    <div class="hero">
      <h1>DSE 要考幾多分，<br>先夠喺香港買到樓？</h1>
      <p class="sub">一個關於分數、樓價，<br>同埋你嘅人生模擬器</p>
      <button class="btn-primary" onclick="goTo(2)">開始 ▶</button>
    </div>
  </section>

  <!-- ② 揀樓 -->
  <section class="screen" id="screen-2">
    <h2>你想住邊種樓？</h2>
    <div class="cards" id="houseCards"></div>
  </section>

  <!-- ③ 揀年齡＋地區 -->
  <section class="screen" id="screen-3">
    <h2>幾多歲買樓？</h2>
    <div class="chips" id="ageChips"></div>
    <h2>想喺邊區買？</h2>
    <div class="chips" id="districtChips"></div>
    <button class="btn-primary" id="toTrackBtn" disabled onclick="goTo(4)">下一步 ▶</button>
  </section>

  <!-- ④ 揀方向 -->
  <section class="screen" id="screen-4">
    <h2>你 DSE 想讀咩方向？</h2>
    <div class="cards" id="trackCards"></div>
  </section>

  <!-- ⑤ 揀專業 -->
  <section class="screen" id="screen-5">
    <h2>系統篩出 3 個專業畀你揀</h2>
    <p class="sub" style="margin-bottom:12px">（第一版：分數默認夠分，先跑通流程）</p>
    <div class="cards" id="majorCards"></div>
  </section>

  <!-- ⑥ 劇情 -->
  <section class="screen" id="screen-6">
    <h2>你嘅人生，開始了</h2>
    <div class="story-box" id="storyBox"></div>
    <button class="btn-primary" id="storyNext">繼續 ▶</button>
  </section>

  <!-- ⑦ 地契 -->
  <section class="screen" id="screen-7">
    <h2 id="deedTitle">恭喜！</h2>
    <div class="deed" id="deed"></div>
    <button class="btn-primary" onclick="renderSocial(); goTo(8)">繼續 ▶</button>
  </section>

  <!-- ⑧ 思考幕 -->
  <section class="screen" id="screen-8">
    <h2>但係，現實係…</h2>
    <div id="socialList"></div>
    <div class="reflection" id="reflection"></div>
    <button class="btn-primary" onclick="renderPoster(); goTo(9)">生成海報 ▶</button>
  </section>

  <!-- ⑨ 海報 -->
  <section class="screen" id="screen-9">
    <h2>你嘅結局</h2>
    <div class="poster" id="poster"></div>
    <p class="share-hint">📸 截圖分享俾朋友，問吓佢考到幾多分</p>
    <button class="btn-secondary" onclick="restart()">再玩一次 ↺</button>
  </section>

  <script>
    // ================= 數據（MVP 初稿，數字僅供參考） =================

    const HOUSES = [
      { id:'villa',   name:'獨棟別墅', emoji:'🏰', price:'5,000萬+',      needScore:35, needIncome:'50萬+',  desc:'山頂嗰種，有花園有泳池，億億聲' },
      { id:'mansion', name:'千尺豪宅', emoji:'🏢', price:'1,500-3,000萬', needScore:30, needIncome:'15-30萬', desc:'1000呎，喺香港已經叫「豪宅」' },
      { id:'private', name:'洋樓',     emoji:'🏬', price:'600-1,200萬',   needScore:26, needIncome:'6-12萬',  desc:'有電梯有管理，正常人嘅目標' },
      { id:'tong',    name:'唐樓',     emoji:'🏚️', price:'300-600萬',     needScore:22, needIncome:'3-6萬',   desc:'無電梯，行樓梯當做運動' },
      { id:'public',  name:'公屋',     emoji:'🏘️', price:'唔使買（輪候）', needScore:0,  needIncome:'1-2萬',   desc:'唔使買，但要排隊等到天荒地老' }
    ];

    const AGES = [25, 30, 35, 40];

    const DISTRICTS = [
      { id:'hk',  name:'港島', note:'最貴，但係最有面' },
      { id:'kln', name:'九龍', note:'中間，交通方便' },
      { id:'nt',  name:'新界', note:'較平，但返工遠到喊' }
    ];

    const TRACKS = {
      arts: {
        name:'文科', emoji:'📚',
        majors:[
          { name:'法律',       score:30, career:'律師',       salary:'8-20萬', desc:'讀到嘔，但搵到食' },
          { name:'翻譯',       score:26, career:'翻譯員',     salary:'3-5萬',  desc:'AI 翻譯嚟緊，自己諗' },
          { name:'新聞傳理',   score:24, career:'記者',       salary:'2-4萬',  desc:'理想好豐滿，人工好骨感' },
          { name:'歷史',       score:22, career:'教師／研究', salary:'3-4萬',  desc:'讀咗先發現冇咩工' },
          { name:'社會工作',   score:20, career:'社工',       salary:'2-3萬',  desc:'幫到人，但幫唔到自己買樓' }
        ]
      },
      science: {
        name:'理科', emoji:'🔬',
        majors:[
          { name:'醫科',   score:35, career:'醫生',       salary:'10-30萬', desc:'神科，讀足六年起' },
          { name:'牙醫',   score:34, career:'牙醫',       salary:'8-25萬',  desc:'唔使夜班，仲好搵' },
          { name:'藥劑',   score:32, career:'藥劑師',     salary:'6-10萬',  desc:'執藥都執到首期' },
          { name:'物理',   score:27, career:'工程／研究', salary:'3-6萬',   desc:'邏輯好，樓價唔講邏輯' },
          { name:'生物',   score:22, career:'實驗室',     salary:'3-5萬',   desc:'穩定，但離豪宅好遠' }
        ]
      },
      engineering: {
        name:'工科', emoji:'⚙️',
        majors:[
          { name:'計算機',   score:28, career:'軟件工程師', salary:'4-10萬', desc:'識寫 code，可能早過人買樓' },
          { name:'數據科學', score:27, career:'數據分析師', salary:'4-8萬',  desc:'識睇數據，睇唔穿樓價' },
          { name:'土木工程', score:24, career:'工程師',     salary:'3-6萬',  desc:'起樓嗰個，自己未必買到樓' },
          { name:'機械工程', score:22, career:'工程師',     salary:'3-5萬',  desc:'硬技術，但樓價更硬' },
          { name:'電子工程', score:20, career:'工程師',     salary:'3-5萬',  desc:'焊板焊唔出首期' }
        ]
      },
      business: {
        name:'商科', emoji:'💼',
        majors:[
          { name:'環球商業', score:32, career:'管理顧問', salary:'8-20萬', desc:'離錢最近，離健康最遠' },
          { name:'金融',     score:30, career:'投行／金融', salary:'8-20萬', desc:'數錢數到手軟（人哋嘅錢）' },
          { name:'會計',     score:26, career:'會計師',   salary:'4-8萬',  desc:'數人哋啲錢，數自己嘅首期' },
          { name:'市場營銷', score:23, career:'營銷',     salary:'3-5萬',  desc:'賣嘢叻，買樓就…' },
          { name:'管理',     score:21, career:'行政／管理', salary:'3-5萬', desc:'管人嘅嘢，管唔住樓價' }
        ]
      }
    };

    const EVENTS = [
      { emoji:'📈', text:'你突然升職加薪！' },
      { emoji:'💰', text:'你投資運氣爆棚，賺咗一筆！' },
      { emoji:'🚀', text:'你跳槽成功，人工翻咗一倍！' },
      { emoji:'📉', text:'公司裁員，你失業咗半年…' },
      { emoji:'🏥', text:'你大病一場，醫藥費燒晒啲積蓄…' },
      { emoji:'📊', text:'樓價又升咗，你嘅首期又遠咗一步…' }
    ];

    // 社會數據（初稿，正式版要查證準確數字）
    const SOCIAL = [
      { num:'全球第1', text:'香港樓價連續多年被評為全球最難負擔' },
      { num:'約 5 成', text:'香港自置居所住戶比例，即係有一半人買唔起' },
      { num:'1,500+', text:'香港登記露宿者人數（實際可能更多）' },
      { num:'20 倍',   text:'樓價中位數 ÷ 家庭年收入中位數（國際標準 3-5 倍先算健康）' }
    ];

    // ================= 狀態 =================
    const state = {
      house:null, age:null, district:null, track:null, major:null, canBuy:false
    };
    let storyNodes = [];
    let storyIndex = 0;

    // ================= 切屏 =================
    function goTo(n) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + n).classList.add('active');
      window.scrollTo(0, 0);
    }
    function restart() {
      Object.assign(state, { house:null, age:null, district:null, track:null, major:null, canBuy:false });
      goTo(1);
    }

    // ================= 工具 =================
    function getHouse() { return HOUSES.find(h => h.id === state.house); }
    function getDistrict() { return DISTRICTS.find(d => d.id === state.district); }
    function getMajor() {
      return TRACKS[state.track].majors.find(m => m.name === state.major);
    }

    // ================= ② 揀樓 =================
    function renderHouses() {
      const box = document.getElementById('houseCards');
      box.innerHTML = '';
      HOUSES.forEach(h => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML =
          '<div class="card-title">' + h.emoji + ' ' + h.name + '</div>' +
          '<div class="card-desc">' + h.desc + '</div>' +
          '<div class="card-tag">💰 ' + h.price + ' · 需要月入 ' + h.needIncome + '</div>';
        div.addEventListener('click', () => {
          state.house = h.id;
          goTo(3);
        });
        box.appendChild(div);
      });
    }

    // ================= ③ 揀年齡＋地區 =================
    function renderAges() {
      const box = document.getElementById('ageChips');
      AGES.forEach(a => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = a + ' 歲';
        chip.addEventListener('click', () => {
          state.age = a;
          document.querySelectorAll('#ageChips .chip').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
          checkStep3();
        });
        box.appendChild(chip);
      });
    }
    function renderDistricts() {
      const box = document.getElementById('districtChips');
      DISTRICTS.forEach(d => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = d.name + '（' + d.note + '）';
        chip.addEventListener('click', () => {
          state.district = d.id;
          document.querySelectorAll('#districtChips .chip').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
          checkStep3();
        });
        box.appendChild(chip);
      });
    }
    function checkStep3() {
      document.getElementById('toTrackBtn').disabled = !(state.age && state.district);
    }

    // ================= ④ 揀方向 =================
    function renderTracks() {
      const box = document.getElementById('trackCards');
      Object.keys(TRACKS).forEach(key => {
        const t = TRACKS[key];
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML =
          '<div class="card-title">' + t.emoji + ' ' + t.name + '</div>' +
          '<div class="card-desc">' + t.majors.map(m => m.name).join(' · ') + '</div>';
        div.addEventListener('click', () => {
          state.track = key;
          renderMajors(); // 揀完方向，先渲染專業列表再切屏（之前漏咗呢行，專業頁先會空白）
          goTo(5);
        });
        box.appendChild(div);
      });
    }

    // ================= ⑤ 揀專業 =================
    function renderMajors() {
      const box = document.getElementById('majorCards');
      box.innerHTML = '';
      const house = getHouse();
      const majors = TRACKS[state.track].majors;
      // 按「分數同買樓目標分數嘅距離」排序，取最接近嘅 3 個
      // 咁樣篩出嚟嘅 3 個專業分數都差唔多，都有機會買到你揀嘅樓
      const top3 = majors.slice()
        .sort((a, b) => Math.abs(a.score - house.needScore) - Math.abs(b.score - house.needScore))
        .slice(0, 3);
      top3.forEach(m => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML =
          '<div class="card-title">' + m.name + '</div>' +
          '<div class="card-desc">' + m.desc + '</div>' +
          '<div class="card-tag">DSE 約 ' + m.score + ' 分 · ' + m.career + ' · 月薪 ' + m.salary + '</div>';
        div.addEventListener('click', () => {
          state.major = m.name;
          state.canBuy = true; // 第一版：默認夠分買到；悲劇版（唔夠分買唔到）第二版開
          goTo(6);
          startStory();
        });
        box.appendChild(div);
      });
    }

    // ================= ⑥ 劇情 =================
    function startStory() {
      const house = getHouse();
      const district = getDistrict();
      const major = getMajor();
      const event = EVENTS[Math.floor(Math.random() * EVENTS.length)];
      const years = state.age - 18;

      storyNodes = [
        { emoji:'📝', text:'你考完 DSE，攞到 ' + major.score + ' 分。' },
        { emoji:'🎓', text:'你入咗大學，讀緊「' + major.name + '」。' },
        { emoji:'💼', text:'大學畢業，你做咗' + major.career + '，月薪 ' + major.salary + '。' },
        { emoji:event.emoji, text:event.text },
        state.canBuy
          ? { emoji:'🏠', text:'捱咗 ' + years + ' 年，你終於儲夠首期，喺' + district.name + '買咗' + house.name + '！' }
          : { emoji:'💔', text:'捱咗 ' + years + ' 年，你仲係買唔起' + district.name + '嘅' + house.name + '。' }
      ];
      storyIndex = 0;
      renderStoryNode();
    }
    function renderStoryNode() {
      const box = document.getElementById('storyBox');
      if (storyIndex < storyNodes.length) {
        box.innerHTML =
          '<div class="story-emoji">' + storyNodes[storyIndex].emoji + '</div>' +
          '<div class="story-text">' + storyNodes[storyIndex].text + '</div>';
        document.getElementById('storyNext').textContent =
          (storyIndex === storyNodes.length - 1) ? '揭曉結局 ▶' : '繼續 ▶';
      } else {
        renderDeed();
        goTo(7);
      }
    }

    // ================= ⑦ 地契 =================
    function renderDeed() {
      const house = getHouse();
      const district = getDistrict();
      const major = getMajor();
      const deed = document.getElementById('deed');
      const title = document.getElementById('deedTitle');

      if (state.canBuy) {
        title.textContent = '恭喜！你買到樓了';
        deed.className = 'deed';
        deed.innerHTML =
          '<h3>香港特別行政區</h3>' +
          '<div class="deed-sub">土地註冊處 · 物業契據</div>' +
          '<div class="deed-row"><span>物業</span><span>' + house.emoji + ' ' + house.name + '</span></div>' +
          '<div class="deed-row"><span>地址</span><span>' + district.name + '（' + district.note + '）</span></div>' +
          '<div class="deed-row"><span>業主</span><span>你（' + major.career + '）</span></div>' +
          '<div class="deed-row"><span>成交價</span><span>HK$ ' + house.price + '</span></div>' +
          '<div class="deed-row"><span>成交年份</span><span>' + state.age + ' 歲那年</span></div>' +
          '<div class="deed-seal">香港<br>樓市<br>見證</div>';
      } else {
        title.textContent = '現實係殘酷嘅';
        deed.className = 'deed rejected';
        deed.innerHTML =
          '<h3>置業申請通知</h3>' +
          '<div class="deed-sub">土地註冊處 · 未能成功</div>' +
          '<div class="deed-row"><span>目標物業</span><span>' + house.emoji + ' ' + house.name + '</span></div>' +
          '<div class="deed-row"><span>目標地區</span><span>' + district.name + '</span></div>' +
          '<div class="deed-row"><span>申請人</span><span>你（' + major.career + '）</span></div>' +
          '<div class="deed-row"><span>結果</span><span>儲唔夠首期，買唔起</span></div>' +
          '<div class="deed-row"><span>原因</span><span>樓價升得快過你份糧</span></div>' +
          '<div class="deed-seal">香港<br>樓市<br>現實</div>';
      }
    }

    // ================= ⑧ 思考幕 =================
    function renderSocial() {
      const list = document.getElementById('socialList');
      list.innerHTML = '';
      SOCIAL.forEach(s => {
        const div = document.createElement('div');
        div.className = 'social-item';
        div.innerHTML =
          '<div class="social-num">' + s.num + '</div>' +
          '<div class="social-text">' + s.text + '</div>';
        list.appendChild(div);
      });
      document.getElementById('reflection').innerHTML = state.canBuy
        ? '你買到樓，但係全香港仲有一半人買唔起。<br><br>考幾多 5**，先至叫做「有保障」？'
        : '你買唔到樓，而呢個，正正係香港一半人嘅日常。<br><br>考幾多 5**，先至叫做「有保障」？';
    }

    // ================= ⑨ 海報 =================
    function renderPoster() {
      const house = getHouse();
      const district = getDistrict();
      const major = getMajor();
      const poster = document.getElementById('poster');
      poster.innerHTML =
        '<div class="poster-head"><h3>DSE 買樓模擬器 · 結局報告</h3></div>' +
        '<div class="poster-body">' +
          '<div class="poster-line"><span>目標樓宇</span><span>' + house.emoji + ' ' + house.name + '</span></div>' +
          '<div class="poster-line"><span>目標地區</span><span>' + district.name + '</span></div>' +
          '<div class="poster-line"><span>選讀專業</span><span>' + major.name + '（' + major.career + '）</span></div>' +
          '<div class="poster-line"><span>DSE 分數</span><span>約 ' + major.score + ' 分</span></div>' +
          '<div class="poster-line"><span>月薪</span><span>' + major.salary + '</span></div>' +
          '<div class="poster-line"><span>結局</span><span>' + (state.canBuy ? '✅ 買到樓' : '❌ 買唔到樓') + '</span></div>' +
        '</div>';
    }

    // ================= 事件綁定 =================
    document.getElementById('storyNext').addEventListener('click', () => {
      storyIndex++;
      renderStoryNode();
    });

    // ================= 啟動 =================
    renderHouses();
    renderAges();
    renderDistricts();
    renderTracks();
  </script>
</body>
</html>
